services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: land_compensation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d land_compensation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compensation_net

  ml_service:
    build: ./ml
    ports:
      - "8001:8001"
    environment:
      ML_SERVICE_PORT: "8001"
      MODEL_PATH: /app/ml/artefacts/compensation_model.joblib
      ML_METRICS_PATH: /app/ml/artefacts/metrics.json
      ML_FEATURE_IMPORTANCE_PATH: /app/ml/artefacts/feature_importance.json
    volumes:
      - ./ml/artefacts:/app/ml/artefacts
    depends_on:
      postgres:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compensation_net

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.example
      - ./backend/.env
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/land_compensation
      ML_SERVICE_URL: http://ml_service:8001
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    networks:
      - compensation_net

volumes:
  pgdata:

networks:
  compensation_net:
    driver: bridge
